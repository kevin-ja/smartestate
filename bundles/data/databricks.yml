# Asset Bundle del pipeline de entrenamiento (job smartestate_train): T1, T2 y T3 en un solo job (new_arch.md §3.1).
#
# Sin valores de cuenta: el host, raw_root, ref_root y el SP salen de .env. Correr siempre con
# scripts/bundle.sh, que los carga solo para ese proceso (ver README de data_pipeline).
# Los dos targets corren como el SP smartestate-jobs; solo dev se despliega durante el trial.

bundle:
  name: smartestate_data

include:
  - resources/*.yml

# El código vive en src/, fuera del bundle. "." hace que la raíz de sync sea la del repo, así el
# workspace conserva la forma src/... que esperan los imports. Solo sube lo que este pipeline usa.
sync:
  paths:
    - .
    - ../../src
    - ../../tests
    - ../../config
  # Relativos a esta carpeta, no a la raíz del repo. La CLI (v1.17) avisa "does not match any
  # files", pero excluyen bien: verificado con `bundle sync --dry-run` (2026-09-29).
  exclude:
    - ../../src/analysis/**
    - ../../src/**/*.md

variables:
  raw_root:
    description: s3://<bucket>/raw. Viene de SMARTESTATE_RAW_ROOT (.env).
  ref_root:
    description: s3://<bucket>/ref, catálogos de referencia (D9). Viene de SMARTESTATE_REF_ROOT (.env).
  runs_root:
    description: s3://<bucket>/runs, salidas de cada corrida. scripts/bundle.sh lo deriva de raw_root.
  models_root:
    description: s3://<bucket>/models, modelos preentrenados (SBERT). scripts/bundle.sh lo deriva de raw_root.
  jobs_sp_id:
    description: application_id del SP smartestate-jobs. Viene de SMARTESTATE_JOBS_SP_ID (.env).
  jobs_policy_id:
    description: Policy de los job clusters. Cambia con cada workspace, así que se busca por nombre.
    lookup:
      cluster_policy: smartestate-jobs
  catalog:
    description: Catálogo de Unity Catalog.
    default: smartestate

run_as:
  service_principal_name: ${var.jobs_sp_id}

# El CLI los aplica a la carpeta del bundle y al job. El SP corre el código desde esa carpeta
# (en dev, el home de quien despliega): sin CAN_VIEW no puede leerlo. Engineers despliega.
permissions:
  - level: CAN_MANAGE
    group_name: smartestate-engineers
  - level: CAN_VIEW
    group_name: smartestate-pipeline

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
