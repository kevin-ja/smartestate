# Etapa 0 · Ingesta: raw/ingest_date=<fecha>/ -> smartestate.bronze.spots (+ cuarentena).
# Etapa 2 · Limpieza: bronze.spots -> smartestate.silver.spots. Corre después de la ingesta, en el
# mismo job cluster (no paga otro arranque). Disparo manual por ahora.
# Etapa 3 · Preprocesamiento: silver.spots -> smartestate.gold.spots. Corre después de la limpieza.

resources:
  jobs:
    ingestion:
      name: smartestate_data-ingestion
      max_concurrent_runs: 1

      # Por defecto, la fecha del run. Para reprocesar: --params ingest_date=YYYY-MM-DD
      parameters:
        - name: ingest_date
          default: "{{job.start_time.iso_date}}"

      job_clusters:
        - job_cluster_key: jobs
          new_cluster:
            # La policy fija nodo, versión y modo de acceso; aquí no se repite nada.
            policy_id: ${var.jobs_policy_id}
            apply_policy_default_values: true

      tasks:
        - task_key: ingestion
          job_cluster_key: jobs
          spark_python_task:
            python_file: ../../../src/data_pipeline/jobs/run_ingestion.py
            parameters:
              - --ingest-date
              - "{{job.parameters.ingest_date}}"
              - --raw-root
              - ${var.raw_root}
              - --bronze-table
              - ${var.catalog}.bronze.spots
              - --quarantine-table
              - ${var.catalog}.bronze.spots_quarantine

        - task_key: cleaning
          depends_on:
            - task_key: ingestion
          job_cluster_key: jobs
          spark_python_task:
            python_file: ../../../src/data_pipeline/jobs/run_cleaning.py
            parameters:
              - --bronze-table
              - ${var.catalog}.bronze.spots
              - --silver-table
              - ${var.catalog}.silver.spots
              - --ref-root
              - ${var.ref_root}

        - task_key: preprocessing
          depends_on:
            - task_key: cleaning
          job_cluster_key: jobs
          spark_python_task:
            python_file: ../../../src/data_pipeline/jobs/run_preprocessing.py
            parameters:
              - --silver-table
              - ${var.catalog}.silver.spots
              - --gold-table
              - ${var.catalog}.gold.spots
